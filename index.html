<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Living War Atlas</title>
    <style>
      /* Tablet / medium viewport: use the otherwise-empty space below the map.
         Short landscape phones keep the dedicated side-panel layout. */
      @media (max-width: 1200px) and (min-height: 501px) {
        body #app {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) auto;
        }

        body .map-stage {
          width: auto;
          height: 100%;
          max-width: 100%;
          max-height: 100%;
          justify-self: start;
        }

        body .side-panel {
          display: grid;
          grid-template-columns: minmax(280px, 1fr) minmax(360px, 1.35fr);
          align-items: start;
          width: 100%;
          max-height: min(34vh, 280px);
          overflow: auto;
        }

        body .hud,
        body .legend,
        body .probe-panel,
        body .diagnostics-panel {
          min-width: 0;
        }
      }

      body .legend {
        container-type: inline-size;
      }

      @container (min-width: 520px) {
        body .legend-grid {
          grid-template-columns: 34px minmax(0, 1fr) 34px minmax(0, 1fr);
          column-gap: 8px;
        }

        body .legend-grid::after {
          grid-column: span 2;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
