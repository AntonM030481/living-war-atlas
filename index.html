    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Autonomous fronts. Emergent warfare." />
    <meta property="og:title" content="Living War Atlas" />

    <meta name="twitter:card" content="summary_large_image" />

    <title>Living War Atlas</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.addEventListener('error', (event) => {
        const target = event.target;
        if (!(target instanceof HTMLScriptElement) || target.src.includes('cloudflareinsights.com')) return;
        document.body.textContent = 'Living War Atlas could not start. Reload the page and try again.';
      }, true);

      const localHost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      window.__LWA_LOCAL_HOST__ = localHost;
    </script>
    <script type="module" src="/src/main.ts"></script>

    <script>
      const nativeApp = location.protocol === 'capacitor:';
      if (!window.__LWA_LOCAL_HOST__ && !nativeApp) {
        const analytics = document.createElement('script');
        analytics.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        analytics.dataset.cfBeacon = JSON.stringify({ token: '944a03af135f467b91ba331ce0e5f374' });
        document.body.appendChild(analytics);
      }
    </script>
  </body>
</html>
