name: Sync package lock version

on:
  push:
    branches:
      - chore/sync-lock-version

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/sync-lock-version

      - name: Sync package-lock version
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          lock.packages[''].version = pkg.version;
          await writeFile('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
          rm .github/workflows/sync-lock-version.yml

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/sync-lock-version.yml
          git commit -m "chore: sync lockfile version"
          git push
